[project]
name = "radar-x-backend"
version = "1.0.0"
description = "RADAR-X Backend: Self-Healing Market Intelligence Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "playwright>=1.42.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "onnxruntime>=1.17.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-html>=0.20.0",
    "scipy>=1.12.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
