<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Organization — Aegis AI Enterprise Security</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#0B0F19] text-slate-200 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#111827] border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6" x-data="{
    fullName: '',
    orgName: '',
    email: '',
    password: '',
    error: '',
    loading: false,
    async handleRegister() {
      this.loading = true;
      this.error = '';
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: this.fullName,
            organization_name: this.orgName,
            email: this.email,
            password: this.password
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');
        window.location.href = '/dashboard';
      } catch (err) {
        this.error = err.message;
      } finally {
        this.loading = false;
      }
    }
  }">
    
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-2xl">
        🛡️
      </div>
      <h1 class="text-xl font-extrabold text-white tracking-tight">Deploy Aegis Enterprise</h1>
      <p class="text-xs text-slate-400">Initialize your Multi-Tenant Security Guardrail</p>
    </div>

    <template x-if="error">
      <div class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-400 font-medium" x-text="error"></div>
    </template>

    <form @submit.prevent="handleRegister" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Your Full Name</label>
        <input type="text" x-model="fullName" required placeholder="Dr. Sarah Jenkins" class="w-full bg-[#1E293B] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Organization Name</label>
        <input type="text" x-model="orgName" required placeholder="Acme Cyber Defense Corp" class="w-full bg-[#1E293B] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Work Email</label>
        <input type="email" x-model="email" required placeholder="ciso@acmecorp.com" class="w-full bg-[#1E293B] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Password (Min. 8 chars)</label>
        <input type="password" x-model="password" minlength="8" required placeholder="••••••••" class="w-full bg-[#1E293B] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <button type="submit" :disabled="loading" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
        <span x-show="!loading">Create Organization & Launch</span>
        <span x-show="loading" class="animate-spin">⏳ Provisioning Node...</span>
      </button>
    </form>

    <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
      Already have an organization? <a href="/login" class="text-indigo-400 font-semibold hover:underline">Sign In</a>
    </div>

  </div>

</body>
</html>
