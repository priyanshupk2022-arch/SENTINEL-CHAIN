[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-proxy"
version = "2.4.0"
description = "Aegis: Commercial AI Security Guardrail Proxy & Document Forensics Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary / Enterprise"}
authors = [
    {name = "Aegis Security Engineering", email = "security@aegis-guardrail.internal"}
]
keywords = [
    "ai-security",
    "guardrails",
    "prompt-injection",
    "document-forensics",
    "pii-redaction",
    "llm-proxy",
    "multi-tenant",
    "fastapi",
    "ed25519"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "jinja2>=3.1.3",
    "sse-starlette>=2.0.0",
    "cryptography>=42.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "reportlab>=4.1.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "stripe>=8.0.0",
    "email-validator>=2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "locust>=2.24.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py"
]
